[package]
name        = "legend-engine-rust-jni"
description = "Engine-flavoured JNI cdylib — re-exports `legend-pure-parser-jni`'s `Java_*` entry points with engine RuntimeExtension crates force-linked so Java callers loading `liblegend_engine_jni` see the engine's natives."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "legend_engine_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Upstream JNI rlib — provides the actual `Java_*` implementations
# (NativeRegistry::discovered() etc.). The forwarders in src/lib.rs
# delegate to these.
legend-pure-parser-jni = { workspace = true }
jni                    = { workspace = true }

# Engine extensions — same set as crates/cli, same rationale (link
# forcing so #[distributed_slice] statics reach the cdylib export).
legend-engine-rust-natives-functions-relation     = { path = "../natives-functions-relation" }
legend-engine-rust-natives-functions-unclassified = { path = "../natives-functions-unclassified" }
