[package]
name        = "legend-engine-rust-core-functions-unclassified-pure"
description = "Build-time embedding of legend-engine's core_functions_unclassified Pure repo"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# Engine-side Pure repo. Descriptor lives in legend-engine itself; we
# reference it by relative path so the source of truth stays in
# legend-engine and we don't fork.
[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-engine-core/legend-engine-core-pure/legend-engine-pure-code-functions-unclassified/legend-engine-pure-functions-unclassified-pure/src/main/resources/core_functions_unclassified.definition.json"
shape      = "embedded"

[dependencies]
legend-pure-core-platform = { workspace = true }

[dev-dependencies]
smol_str = { workspace = true }

[build-dependencies]
legend-pure-build = { workspace = true }
