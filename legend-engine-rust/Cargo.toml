[workspace]
resolver = "2"
members = [
    "crates/core-functions-json-pure",
    "crates/core-functions-relation-pure",
    "crates/core-functions-standard-pure",
    "crates/core-functions-unclassified-pure",
    "crates/core-functions-variant-pure",
    "crates/integration-smoke",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/finos/legend-engine"

[workspace.dependencies]
# Path-deps into the sibling legend-pure-rust workspace at /Users/.../legend-pure/legend-pure-rust.
# Both projects live under the same parent so the relative path is stable.
legend-pure-core-platform = { path = "../../legend-pure/legend-pure-rust/crates/core-platform-pure" }
legend-pure-build         = { path = "../../legend-pure/legend-pure-rust/crates/build" }
legend-pure-parser-pure   = { path = "../../legend-pure/legend-pure-rust/crates/pure" }

# Standard
smol_str = "0.3"

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.test]
inherits = "dev"
